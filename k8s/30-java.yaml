apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-service
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-service
  template:
    metadata:
      labels:
        app: java-service
    spec:
      containers:
        - name: java-service
          image: demofullstackdocker-java-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: java-service
  namespace: demo
spec:
  selector:
    app: java-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
