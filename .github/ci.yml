name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Java tests
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven test
        working-directory: java-api
        run: mvn -B test

      # ----- Python checks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py-api/requirements.txt

      - name: Install Python deps
        working-directory: py-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python quick check
        working-directory: py-api
        run: python -m compileall .

      # ----- Docker build check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (java)
        uses: docker/build-push-action@v6
        with:
          context: ./java-api
          file: ./java-api/Dockerfile
          push: false

      - name: Docker build (python)
        uses: docker/build-push-action@v6
        with:
          context: ./py-api
          file: ./py-api/Dockerfile
          push: false

      - name: Docker build (web)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
